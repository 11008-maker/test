<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Learning Hub | Parody</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 30%,#163751,transparent 47%),radial-gradient(circle at 80% 15%,#29214e,transparent 52%),#0b1020;color:#eaf5ff;font-family:system-ui,sans-serif}
header{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:24px 4%;background:#0e1627c9;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:15px;font-weight:750;font-size:21px}.logo{display:grid;place-items:center;width:58px;height:58px;border-radius:17px;background:linear-gradient(125deg,#67d9e7,#8a89e8);color:#0e1b2c;font-size:25px}.sub{font-size:11px;letter-spacing:3px;color:#a5bdd5;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;cursor:pointer;color:inherit;background:none;border:none;padding:16px 18px;border-radius:15px}button:hover{background:#ffffff20}nav button.active{background:#ffffff18;border-bottom:2px solid #6ad5eb}.back{background:#3065b0;border:1px solid #a2c7ff}main{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;padding:25px 4%}.panel{border:1px solid #6686a257;border-radius:35px;background:#ffffff0a;min-height:590px;padding:clamp(25px,5vw,70px)}.eyebrow{color:#83e0e9;letter-spacing:4px;font-size:12px;font-weight:750}h1{font-size:clamp(43px,5vw,75px);line-height:1.07;letter-spacing:-2px;margin:38px 0 25px}p{color:#b2c6d9;font-size:18px;line-height:1.7}.cta{background:linear-gradient(115deg,#6de0e7,#aaa2fb);font-weight:750;color:#17233c;margin-top:34px;box-shadow:0 10px 38px #50cada2f;padding:18px 30px}.orb{width:210px;height:210px;max-width:80%;border-radius:50%;margin:25px auto 38px;background:radial-gradient(circle at 30% 25%,#d5ffff,#70d9fb 28%,#7474dc 58%,#393173 78%,#222444);box-shadow:inset -17px -17px 45px #151334a0,0 0 85px #59a7ff59}.choices{display:grid;gap:13px;margin-top:25px}.choice{border:1px solid #7792b05b;background:#ffffff10;text-align:left;padding:22px;font-weight:700}.choice span{display:block;color:#bad0df;font-weight:400;margin-top:8px;font-size:14px}footer{text-align:center;color:#96a9bb;font-size:12px;padding:20px}#overlay{display:none;position:fixed;inset:0;z-index:1000;background:#000;align-items:center;justify-content:center}#overlay.show{display:flex}#movie{width:100%;height:100%;object-fit:contain}#close{position:absolute;z-index:1002;right:15px;top:15px;background:#ffffffea;color:#111;padding:10px 15px;border-radius:30px}@media(max-width:750px){main{grid-template-columns:1fr}.panel{min-height:0;padding:36px 25px}header{padding:18px}.brand{font-size:16px}.orb{width:130px;height:130px;margin:0 auto 20px}}
</style></head><body>
<header><div class="brand"><div class="logo">✦</div><div>English Learning Hub<div class="sub">LEARN · EXPLORE · GROW</div></div></div><nav><button class="active">Home</button><button>My Course</button><button>Settings</button><button>☰ Menu</button><button class="back">← Back</button></nav></header>
<main><section class="panel"><div class="eyebrow">✦ WELCOME TO YOUR LEARNING SPACE</div><h1>Choose your<br>learning path<span style="color:#84e5ef">.</span></h1><p>Your English adventure starts here. Explore lessons and grow your skills, one step at a time.</p><button class="cta">Explore My Course →</button></section>
<section class="panel"><div class="orb" aria-hidden="true"></div><div class="eyebrow">YOUR LEARNING JOURNEY</div><h2>Where would you like to go?</h2><div class="choices"><button class="choice">📘 My English Class <span>Continue your English learning journey</span></button><button class="choice">🎯 Practice Activities <span>Build your skills with fun exercises</span></button><button class="choice">📈 Learning Progress <span>See how much you've learned</span></button></div></section></main>
<footer>Unofficial English Learning Hub parody</footer>
<div id="overlay"><button id="close" aria-label="Close">✕</button><video id="movie" playsinline controls preload="none"><source src="media.mp4" type="video/mp4"></video></div>
<script>
const movie=document.getElementById('movie'), overlay=document.getElementById('overlay');
document.querySelectorAll('button:not(#close)').forEach(b=>b.addEventListener('click',()=>{overlay.classList.add('show');movie.currentTime=0;movie.play().catch(()=>{});}));
function closeMedia(){movie.pause();movie.currentTime=0;overlay.classList.remove('show')}
document.getElementById('close').addEventListener('click',closeMedia);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMedia()});
movie.addEventListener('ended',closeMedia);
</script></body></html>
